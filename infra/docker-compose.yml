# AI Learning Copilot - 本地开发数据库。仅用于本机，不对外暴露。
# 启动：docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-learning-copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
      TZ: UTC
    ports:
      # 只绑定回环地址，宿主机之外无法访问
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot} -d ${POSTGRES_DB:-copilot}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: ai-learning-copilot-postgres-data
