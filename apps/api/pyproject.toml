[project]
name = "ai-learning-copilot-api"
version = "0.1.0"
description = "AI Learning Copilot backend API (Sprint 0 skeleton)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0,<0.163.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
    "pydantic>=2.14.2,<3.0.0",
    "pydantic-settings>=2.16.2,<2.17.0",
    "sqlalchemy[asyncio]>=2.1.6,<2.2.0",
    "asyncpg>=0.32.0,<0.33.0",
    "alembic>=1.20.1,<1.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.4.1.post1,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration'"
markers = [
    "integration: requires a running local PostgreSQL (docker compose -f infra/docker-compose.yml up -d)",
]

[tool.uv]
package = false
