[project]
name = "ai-learning-copilot-api"
# 版本号跟随仓库发布标签（v0.1.x）；这里不是独立发布的包（见 [tool.uv] package = false）。
version = "0.1.45"
description = "AI Learning Copilot backend: diagnostics, lessons, study plan, exercises, DeepSeek tutor and knowledge retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0,<0.163.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
    "pydantic>=2.14.2,<3.0.0",
    "pydantic-settings>=2.16.2,<2.17.0",
    "sqlalchemy[asyncio]>=2.1.6,<2.2.0",
    "asyncpg>=0.32.0,<0.33.0",
    "alembic>=1.20.1,<1.21.0",
    # Sprint 4: the DeepSeek transport is runtime code, so httpx is no longer a
    # test-only package. It was already locked; no new package is introduced.
    "httpx>=0.28.1,<0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.4.1.post1,<2.0.0",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration'"
markers = [
    "integration: requires a running local PostgreSQL (docker compose -f infra/docker-compose.yml up -d)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes; I: import order; UP: pyupgrade; B: bugbear.
# E501 (line length) is off: this codebase explains decisions in long Chinese
# comments, and reformatting them would hurt far more than it helps.
# B008 is off because Depends(...) in an argument default is the FastAPI idiom.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.uv]
package = false
